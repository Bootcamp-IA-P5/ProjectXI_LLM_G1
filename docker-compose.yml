services:
  
  backend:
    build:
      context: . # Raiz del proyecto
      dockerfile: ./backend/Dockerfile
    ports: 
      - "5001:5000"
    environment:
      - BACKEND_PORT=5000
    env_file: .env
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports: 
      - "3000:3000"
    environment:
      # ✅ CAMBIO: Usar localhost en lugar de 'backend'
      # Porque el navegador NO está en la red Docker
      - REACT_APP_API_URL=http://localhost:5001/api
    depends_on:
      backend:
        condition: service_started
